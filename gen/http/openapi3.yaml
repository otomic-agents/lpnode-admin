                - api_key
                - status
        CACexAccountBalance:
            type: object
            properties:
                asset:
                    type: string
                    description: 'Asset name (e.g.: USDT, BTC)'
                    example: USDT
                free:
                    type: string
                    description: Available balance
                    example: "950.00"
                locked:
                    type: string
                    description: Locked balance
                    example: "50.50"
                price:
                    type: string
                    description: Current price (optional, if provided by exchange)
                    example: "1.00"
                total:
                    type: string
                    description: Total balance
                    example: "1000.50"
            description: Balance information for a single asset in a CEX account
            example:
                asset: USDT
                free: "950.00"
                locked: "50.50"
                price: "1.00"
                total: "1000.50"
            required:
                - asset
                - total
                - free
                - locked

            summary: transactionList chainClientTransaction
            description: Get transaction list
            operationId: chainClientTransaction#transactionList
            parameters:
                - name: object
                  in: body
                  required: true
                  schema:
                    type: object
                    properties:
                        businessId:
                            type: string
                            description: Filter by business ID
                            example: Sunt quos et hic occaecati in.
                        chainId:
                            type: integer
                            description: Filter by chain ID
                            example: 4316053840676153437
                            format: int64
                        endTime:
                            type: integer
                            description: End time
                            example: 3345743074770430229
                            format: int64
                        page:
                            type: integer
                            description: Page number
                            default: 1
                            example: 7857409793465211259
                            minimum: 1
                        pageSize:
                            type: integer
                            description: Page size
                            default: 10
                            example: 58
                            minimum: 1
                            maximum: 100
                        startTime:
                            type: integer
                            description: Start time
                            example: 4274298670673032706
                            format: int64
                        status:
                            type: string
                            description: Filter by status
                            example: Aut dolor expedita rem.
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ChainClientTransactionTransactionListResponseBody'
                        required:
                            - code
                            - message
                            - result
            schemes:
                - http
